---
- name: Install Docker runtime package
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started

- name: Add ec2-user to docker group
  ansible.builtin.user:
    name: ec2-user
    groups: "{{ docker_group_name }}"
    append: true

- name: Optionally manage Docker daemon configuration
  when: docker_manage_daemon_json | bool
  block:
    - name: Ensure Docker daemon config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Render Docker daemon configuration
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ docker_daemon_options | to_nice_json }}\n"
        mode: "0644"
      notify: Restart Docker
