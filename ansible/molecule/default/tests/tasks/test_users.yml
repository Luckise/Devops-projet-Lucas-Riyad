---
# tests/tasks/test_users.yml

- name: Test user creation
  ansible.builtin.import_role:
    name: common
  vars:
    app_user: "testuser"
    app_group: "testgroup"
    app_user_shell: "/usr/sbin/nologin"
  check_mode: false
  tags: ['user-creation']

- name: Verify testuser exists
  ansible.builtin.command: "id testuser"
  register: user_check
  failed_when: user_check.rc != 0
  changed_when: false
  tags: ['verify-users']

- name: Verify testgroup exists
  ansible.builtin.command: "id testgroup"
  register: group_check
  failed_when: group_check.rc != 0
  changed_when: false
  tags: ['verify-groups']

- name: Verify testuser has correct shell
  ansible.builtin.command: "grep testuser /etc/passwd | grep '/usr/sbin/nologin'"
  register: shell_check
  failed_when: shell_check.rc != 0
  changed_when: false
  tags: ['verify-shell']
