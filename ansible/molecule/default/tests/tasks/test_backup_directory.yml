---
# tests/tasks/test_backup_directory.yml

- name: Test backup directory creation
  ansible.builtin.import_role:
    name: backup
  vars:
    app_backup_dir: "/tmp"
    app_container_name: "test-app"
  check_mode: false
  tags: ['backup-directory']

- name: Verify backup directory exists
  ansible.builtin.file:
    path: "/tmp/test-app-backup"
    state: directory
    mode: "0755"
  register: backup_dir
  failed_when: backup_dir.failed
  changed_when: true
  tags: ['verify-backup-dir']
