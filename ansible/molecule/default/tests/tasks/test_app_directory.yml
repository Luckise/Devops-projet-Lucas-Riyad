---
# tests/tasks/test_app_directory.yml

- name: Test application directory creation
  ansible.builtin.import_role:
    name: app
  vars:
    app_install_dir: "/opt/test-app"
    app_user: "testuser"
    app_container_name: "test-app"
  check_mode: false
  tags: ['app-directory']

- name: Verify application directory exists
  ansible.builtin.file:
    path: "/opt/test-app"
    state: directory
    owner: "testuser"
    group: "testuser"
    mode: "0755"
  register: app_dir
  failed_when: app_dir.failed
  changed_when: true
  tags: ['verify-app-directory']

- name: Verify application directory permissions
  ansible.builtin.command: "ls -ld /opt/test-app"
  register: dir_permissions
  changed_when: false
  tags: ['verify-permissions']
