---
# tests/tasks/test_backup_cron.yml

- name: Test backup cron job setup
  ansible.builtin.import_role:
    name: backup
  vars:
    app_backup_cron_minute: "0"
    app_backup_cron_hour: "2"
    app_backup_cron_user: "root"
    app_backup_dir: "/tmp/test-app-backup"
  check_mode: false
  tags: ['backup-cron']

- name: Test cron job creation
  ansible.builtin.cron:
    name: "Application database backup"
    minute: "0"
    hour: "2"
    user: "root"
    job: "/tmp/test-app-backup/backup.sh"
  register: cron_job
  failed_when: cron_job.failed
  changed_when: true
  tags: ['verify-cron']
