---
# tests/tasks/test_credentials.yml

- name: Test AWS credentials setup
  ansible.builtin.import_role:
    name: common
  vars:
    aws_credentials_mode: "vault"
    aws_access_key_id: "AKIAIOSFODNN7EXAMPLE"
    aws_secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    app_user: "testuser"
    aws_credentials_dir: "/home/testuser/.aws"
    aws_credentials_file: "/home/testuser/.aws/credentials"
  check_mode: false
  tags: ['credentials-setup']

- name: Verify AWS credentials directory exists
  ansible.builtin.file:
    path: "/home/testuser/.aws"
    state: directory
    owner: "testuser"
    group: "testuser"
    mode: "0700"
  register: credentials_dir
  failed_when: credentials_dir.failed
  changed_when: true
  tags: ['verify-credentials']

- name: Verify AWS credentials file exists and has correct permissions
  ansible.builtin.file:
    path: "/home/testuser/.aws/credentials"
    state: file
    owner: "testuser"
    group: "testuser"
    mode: "0600"
  register: credentials_file
  failed_when: credentials_file.failed
  changed_when: true
  tags: ['verify-credentials']
