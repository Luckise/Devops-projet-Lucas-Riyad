---
# tests/tasks/test_backup_script.yml

- name: Test backup script setup
  ansible.builtin.import_role:
    name: backup
  vars:
    app_container_name: "test-app"
    backup_bucket_name: "devops-projet-lucas-riyad-dev-backups-test"
    db_host: "devops-projet-lucas-riyad-dev-db-test.cvgqemogmgnt.eu-west-3.rds.amazonaws.com"
  check_mode: false
  tags: ['backup-script']

- name: Verify backup script file exists
  ansible.builtin.stat:
    path: "/opt/test-app/backup/backup.sh"
  register: backup_script
  changed_when: false
  tags: ['verify-backup-script']

- name: Verify backup script is executable
  ansible.builtin.command: "test -x /opt/test-app/backup/backup.sh"
  register: script_executable
  changed_when: false
  tags: ['verify-executable']
