---
# tests/tasks/test_services.yml

- name: Test service management
  ansible.builtin.import_role:
    name: common
  vars:
    docker_packages:
      - docker.io
  check_mode: false
  tags: ['service-management']
  when: ansible_os_family == 'Debian'

- name: Verify Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
  register: docker_status
  failed_when: docker_status.failed
  changed_when: false
  tags: ['verify-services']

- name: Verify Docker service is enabled
  ansible.builtin.systemd:
    name: docker
    enabled: true
  register: docker_enabled
  failed_when: docker_enabled.failed
  changed_when: false
  tags: ['verify-services']
